name: CI

on:
  pull_request:
  push:
    branches: [main, "build/**"]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.17.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: pnpm install --no-frozen-lockfile
      - uses: actions/upload-artifact@v4
        with:
          name: pnpm-lock
          path: pnpm-lock.yaml
          retention-days: 1
      - name: Generate Better Auth schema
        run: |
          mkdir -p generated
          pnpm dlx auth@1.7.5 generate --config apps/web/lib/auth.ts --output generated/better-auth.sql --yes
      - uses: actions/upload-artifact@v4
        with:
          name: better-auth-schema
          path: generated/better-auth.sql
          retention-days: 1
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
